name: Paper trade - stocks

on:
  # GitHub's own schedule trigger is intentionally NOT used here. Stocks
  # are meant to stay fully inert until a human explicitly re-enables
  # trading on cron-job.org (see docs/AUTOMATION.md) - a native
  # `schedule:` block here would fire regardless of that "paused"
  # status, which is exactly what caused an unwanted live BUY on
  # 2026-07-28 while the README/CHANGELOG said stocks were paused.
  # workflow_dispatch is still here so cron-job.org (or a manual "Run
  # workflow" click) can trigger a run on purpose - only removing
  # GitHub's *automatic* trigger.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trade-stocks
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # Meant to be called every ~5 minutes during regular market hours by
    # an external scheduler (see docs/AUTOMATION.md) - matches the
    # 5-minute bar size the wired-in strategy was actually walk-forward
    # validated at. 4 minutes leaves margin before the next call, the
    # same reasoning as paper-trade-crypto.yml's timeout.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run stock strategy
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
        # rule_based, 5-minute bars, dip=-1.5%/exit=2.0% - the best-of-8
        # walk-forward candidate (see docs/RESEARCH.md), not ml_filtered.
        # A prior version of this workflow ran --strategy ml_filtered
        # --dip-threshold -0.03 (a stale, never-validated combo left over
        # from before this project's walk-forward work) - that mismatch,
        # combined with GitHub's own schedule trigger still being active
        # despite the documented "paused" status, is what caused the
        # unwanted 2026-07-28 BUYs. --max-notional/--daily-loss-limit
        # mirror the caps paper-trade-crypto.yml already had, which
        # stocks were previously missing entirely.
        run: >
          python live_trade.py --ticker SPY AAPL QQQ JPM XOM JNJ KO CAT DIS
          --strategy rule_based --interval 5m
          --dip-threshold -0.015 --exit-threshold 0.02
          --max-notional 2000 --daily-loss-limit 0.05
          --execute

      - name: Commit trade log
        run: |
          git config user.name "investingbot"
          git config user.email "investingbot@users.noreply.github.com"
          [ -f logs/trade_log.csv ] && git add logs/trade_log.csv
          [ -f logs/equity_log.csv ] && git add logs/equity_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Log stock trading run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
