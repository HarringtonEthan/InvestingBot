name: Retrain stock ML model

on:
  # No native GitHub `schedule:` trigger, on purpose - the live stock
  # strategy is currently `rule_based` (see paper-trade-stocks.yml), not
  # `ml_filtered`, so there's no live path consuming a fresh model right
  # now. Kept deliberately off (workflow_dispatch only) rather than
  # left on a schedule "just in case" - the 2026-07-28 incident on the
  # trading workflow was exactly a `schedule:` trigger firing on
  # something meant to stay inert. Re-add a schedule (or call
  # workflow_dispatch from cron-job.org) only when ml_filtered is
  # actually the live strategy again.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: retrain-stock-model
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # A hung run has no cutoff otherwise (GitHub's own default is 6 hours).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Retrain stock model
        run: python train_stock_model.py --ticker SPY AAPL QQQ JPM XOM JNJ KO CAT DIS --lookback-days 730

      - name: Commit updated model
        run: |
          git config user.name "investingbot"
          git config user.email "investingbot@users.noreply.github.com"
          git add models/stock_model.pkl models/stock_model.pkl.meta.json logs/retrain_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Retrain stock ML model $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # See paper-trade-stocks.yml's "Commit trade log" step for why
          # this retries instead of failing on the first conflict - a
          # concurrent trading/dashboard workflow commit can win the
          # race to push first.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push attempt $i failed (likely a concurrent commit from another workflow) - retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push the updated model after 5 attempts."
          exit 1
