name: Update trade dashboard

on:
  # Best-effort only - GitHub's own schedule trigger has been unreliable
  # in this project (see docs/AUTOMATION.md). Point an
  # external scheduler (e.g. cron-job.org) at this workflow's
  # workflow_dispatch endpoint instead, the same way it's already wired
  # up for the trading/retrain workflows.
  #
  # Untouched since before the casino-dashboard website replaced the PNG
  # dashboard this workflow used to generate: cron-job.org (or a manual
  # "Run workflow" click) is what actually fires this, exactly as before -
  # only what the job *does* changed, never what triggers it.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  # The build job commits results/trade_dashboard.png back to the branch
  # (the PNG dashboard this workflow generated before the casino website
  # existed, kept running alongside it on request) - contents: write is
  # for that. Doing so here is safe against workflow loops specifically
  # because this workflow is schedule/workflow_dispatch-triggered, never
  # push-triggered - a commit landing on the branch can't cause this
  # workflow (or itself) to fire again the way an on:push trigger would.
  # site/data/*.json still never gets committed (see the build job's
  # comment) - that half of the loop-prevention design is unchanged.
  contents: write
  # Needed for the deploy job's actions/deploy-pages step below.
  pages: write
  id-token: write

concurrency:
  # A single shared concurrency group across both jobs (Pages deployments
  # are already serialized by GitHub itself per-environment, but this
  # keeps a slow build from overlapping a following one the same way the
  # old PNG-committing version did).
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung run has no cutoff otherwise (GitHub's own default is 6 hours).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Generate dashboard data (JSON)
        # Replaces the old `python visualize_log.py --baseline ... --live-positions`
        # PNG step - see CHANGELOG.md for the casino-dashboard-website
        # rewrite. site_data.py reads the exact same logs/*.csv files
        # visualize_log.py always did (one source of truth, not a second
        # copy that could drift) and additionally pulls live positions/
        # cash/equity/buying-power from Alpaca when --live-positions is
        # given - read-only, never places an order, same as before.
        # Unlike the old --baseline flag, nothing here is a hardcoded
        # dollar amount: every period's starting value is derived from
        # equity_log.csv itself (see site_data.py's module docstring).
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Hardcoded to the paper endpoint (never live), matching the
          # other workflows - this script only ever reads account state,
          # but there's no reason to let a stray live-endpoint secret
          # enable that.
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
        run: python site_data.py --live-positions --out-dir site/data

      - name: Generate dashboard PNG (results/trade_dashboard.png)
        # Restores the original PNG dashboard alongside the website - on
        # request, both get kept up to date by the same cron rather than
        # the PNG being dropped when the site replaced it as the primary
        # view. Same read-only --live-positions pull as above, same
        # logs/*.csv source of truth, no hardcoded --baseline.
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
        run: python visualize_log.py --live-positions

      - name: Commit dashboard PNG
        run: |
          git config user.name "investingbot"
          git config user.email "investingbot@users.noreply.github.com"
          [ -f results/trade_dashboard.png ] && git add results/trade_dashboard.png
          git diff --cached --quiet && exit 0
          git commit -m "Update trade dashboard PNG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Same retry pattern as paper-trade-stocks.yml/paper-trade-crypto.yml -
          # this workflow's own overlapping runs (or a trading-log commit
          # landing between fetch and push) are the only realistic race here.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push attempt $i failed (likely a concurrent commit from another workflow) - retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push the dashboard PNG after 5 attempts."
          exit 1

      - name: Upload Pages artifact
        # This is the "prevent workflow loops" mechanism the task asked
        # for: the generated JSON lives only inside this build's
        # artifact, never committed back to the branch - so this
        # workflow can never trigger itself (or any push-triggered
        # workflow) the way committing site/data/*.json every run would.
        # site/ already holds the static index.html/assets/ checked into
        # git; this step just adds this run's freshly-generated data/
        # JSON on top before uploading the whole directory as one artifact.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
