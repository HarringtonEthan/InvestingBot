name: Paper trade - crypto

on:
  # No native GitHub `schedule:` trigger, on purpose - same reasoning as
  # paper-trade-stocks.yml. This used to have `schedule: "*/5 * * * *"`
  # alongside workflow_dispatch, meaning GitHub itself and cron-job.org
  # were BOTH able to trigger a run - an unnecessary second trigger path
  # for a workflow cron-job.org already calls reliably every 5 minutes
  # (see docs/AUTOMATION.md), and one more source of the exact kind of
  # concurrent-commit collision .gitattributes/the retry loop below
  # exist to handle. workflow_dispatch is the only way this runs now.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trade-crypto
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # A hung run has no cutoff otherwise (GitHub's own default is 6
    # hours) and, since cancel-in-progress is false above, would just
    # queue up every subsequent 5-minute trigger behind it instead of
    # replacing it. 4 minutes leaves margin before the next scheduled run.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run crypto strategy
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
        run: >
          python live_trade.py --ticker BTC ETH SOL DOGE LTC AVAX LINK XRP DOT
          --strategy day_trading --interval 5m
          --dip-threshold -0.04 --profit-target 0.01 --stop-loss 0.05
          --max-notional 2000 --daily-loss-limit 0.05
          --execute

      - name: Commit trade log
        run: |
          git config user.name "investingbot"
          git config user.email "investingbot@users.noreply.github.com"
          [ -f logs/trade_log.csv ] && git add logs/trade_log.csv
          [ -f logs/equity_log.csv ] && git add logs/equity_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Log crypto trading run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retries pull+rebase+push a few times before giving up - this
          # workflow's own runs are serialized by the concurrency group
          # above, but paper-trade-stocks.yml/update-dashboard.yml can
          # still race it to push at nearly the same moment (all commit
          # to logs/equity_log.csv). The main fix for that is
          # .gitattributes (merge=union on the log CSVs) - two
          # independent appends to the same file no longer conflict at
          # all, confirmed by reproducing the exact failure locally. This
          # retry loop is a second layer for the residual case that
          # isn't a content conflict at all: a plain non-fast-forward
          # push rejection because someone else's commit landed between
          # our fetch and our push - re-fetching and pushing again
          # resolves that. git rebase --abort clears any half-finished
          # rebase from a failed attempt so the next retry starts clean.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push attempt $i failed (likely a concurrent commit from another workflow) - retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push the trade log after 5 attempts."
          exit 1
