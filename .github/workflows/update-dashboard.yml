name: Update trade dashboard

on:
  # Best-effort only - GitHub's own schedule trigger has been unreliable
  # in this project (see docs/AUTOMATION.md). Point an
  # external scheduler (e.g. cron-job.org) at this workflow's
  # workflow_dispatch endpoint instead, the same way it's already wired
  # up for the trading/retrain workflows.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A hung run has no cutoff otherwise (GitHub's own default is 6 hours).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Generate dashboard
        # 99787.08 is the account's real value at the start of today
        # (2026-07-28, before any of today's trades) - not the original
        # $100k funding amount. This is a deliberate choice to show
        # "today's P&L," not "all-time P&L since funding" - see
        # docs/AUTOMATION.md's baseline explanation for the difference
        # and why this needs updating again whenever a fresh "day" or
        # tracking period is what should be measured going forward.
        # --live-positions pulls current open positions from Alpaca
        # (read-only - never places an order) so the crypto/stock P&L
        # panels show live unrealized gain/loss too, not just closed trades.
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: python visualize_log.py --baseline 99787.08 --live-positions

      - name: Commit updated dashboard
        run: |
          git config user.name "investingbot"
          git config user.email "investingbot@users.noreply.github.com"
          [ -f results/trade_dashboard.png ] && git add results/trade_dashboard.png
          git diff --cached --quiet && exit 0
          git commit -m "Update trade dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # See paper-trade-stocks.yml's "Commit trade log" step for why
          # this retries instead of failing on the first conflict - a
          # concurrent trading/retrain workflow commit can win the race
          # to push first.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Push attempt $i failed (likely a concurrent commit from another workflow) - retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push the updated dashboard after 5 attempts."
          exit 1
